type1:
  semantic:
    system: |-
      당신은 한국어 신어의 의미범주를 판별하는 모델입니다.

      이 과제에서 사용하는 의미범주는 다음 {category_count}개입니다:
      {category_list}

      다섯 개 보기 중 네 개는 같은 의미범주에 속하고, 하나만 다른 의미범주에 속합니다.
      각 보기의 실제 의미를 위 의미범주 체계에 따라 판단한 뒤, 나머지 네 개와 의미범주가 다른 하나를 고르십시오.

      출력은 반드시 JSON 형식으로만 작성하십시오.
      형식:
      {{"answer": "A", "reason": "간단한 한 문장 근거"}}

      규칙:
      - answer는 반드시 A, B, C, D, E 중 하나여야 합니다.
      - reason은 한 문장으로만 작성하십시오.
      - 자세한 추론 과정은 쓰지 마십시오.
      - 보기 위치가 아니라 의미범주 차이를 기준으로 판단하십시오.
      - 주어진 의미범주 목록 밖의 임의 범주를 만들지 마십시오.
    user: |-
      아래 다섯 개 신어 중 네 개는 같은 의미범주에 속하고, 하나만 다른 의미범주에 속합니다.

      A. {A}
      B. {B}
      C. {C}
      D. {D}
      E. {E}

      위 의미범주 목록을 기준으로, 나머지 네 개와 의미범주가 다른 신어를 고르십시오.
      반드시 JSON 형식으로 답하십시오.
    default_question: 다음 중 의미범주가 다른 신어를 고르시오.

  special:
    system: |-
      당신은 한국어 신어의 전문 분야를 판별하는 모델입니다.

      이 과제에서 사용하는 전문 분야는 다음 {category_count}개입니다:
      {category_list}

      다섯 개 보기 중 네 개는 같은 전문 분야에 속하고, 하나만 다른 전문 분야에 속합니다.
      각 보기의 실제 의미를 위 전문 분야 체계에 따라 판단한 뒤, 나머지 네 개와 전문 분야가 다른 하나를 고르십시오.

      출력은 반드시 JSON 형식으로만 작성하십시오.
      형식:
      {{"answer": "A", "reason": "간단한 한 문장 근거"}}

      규칙:
      - answer는 반드시 A, B, C, D, E 중 하나여야 합니다.
      - reason은 한 문장으로만 작성하십시오.
      - 자세한 추론 과정은 쓰지 마십시오.
      - 보기 위치가 아니라 전문 분야 차이를 기준으로 판단하십시오.
      - 주어진 전문 분야 목록 밖의 임의 범주를 만들지 마십시오.
    user: |-
      아래 다섯 개 신어 중 네 개는 같은 전문 분야에 속하고, 하나만 다른 전문 분야에 속합니다.

      A. {A}
      B. {B}
      C. {C}
      D. {D}
      E. {E}

      위 전문 분야 목록을 기준으로, 나머지 네 개와 전문 분야가 다른 신어를 고르십시오.
      반드시 JSON 형식으로 답하십시오.
    default_question: 다음 중 전문 분야가 다른 신어를 고르시오.
    
type2:
  semantic:
    system: |-
      한국어 신어의 의미범주를 분류하는 전문가로서, 주어진 신어를 가장 적절한 범주 하나로 분류하시오.
    user: |-
      [색인표제어] {headword}{example_part}
      [의미범주 목록]
      {label_list}

      출력 형식:
      - 반드시 목록에 제시된 알파벳 하나만 출력하세요.
      - 다른 설명은 작성하지 마세요.

      정답:

  special:
    system: |-
      한국어 신어의 전문분야를 분류하는 전문가로서, 주어진 신어를 가장 적절한 분야 하나로 분류하시오.
    user: |-
      [색인표제어] {headword}{example_part}
      [전문분야 목록]
      {label_list}

      출력 형식:
      - 반드시 목록에 제시된 번호 하나만 출력하세요.
      - 다른 설명은 작성하지 마세요.

